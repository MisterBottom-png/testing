# cargo deny check  (https://github.com/EmbarkStudios/cargo-deny)
[graph]
all-features = true
# The platforms A-Studio ships (D7: Windows x64; the web build stays). Dependencies behind other
# cfgs are never built into A-Studio: e.g. rav1e (AVIF encode) needs libfuzzer-sys (NCSA) only
# under cfg(fuzzing), when rav1e itself is being fuzzed.
targets = ["x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]

[licenses]
# Licences that appear in the two upstream dependency trees (see their NOTICE files) and are
# compatible with shipping A-Studio under MIT OR Apache-2.0.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "BSL-1.0", "Unicode-3.0", "CC0-1.0", "OFL-1.1", "MPL-2.0", "IJG",
]
confidence-threshold = 0.9

[bans]
# P2-03: one version of every crate (docs/03-dependencies.md). A second version is allowed only
# when a crate outside A-Studio forces it, listed in `skip` below with the reason.
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between A-Studio's own unpublished crates carry no version; that is not a
# wildcard on crates.io. Approved by the owner on 8 October 2026.
allow-wildcard-paths = true
skip = [
  # Test-only: proptest's rand 0.9 uses getrandom 0.3, its tempfile uses getrandom 0.4.
  { crate = "getrandom@0.3.4", reason = "proptest (rand_core 0.9), tests only" },
  # Image decoding (astudio-vdoc, P2-13), both upstream apps have the same pair:
  { crate = "miniz_oxide@0.8.9", reason = "png 0.18 uses miniz_oxide 0.8 directly and 0.9 through flate2" },
  { crate = "quick-error@1.2.3", reason = "proptest's rusty-fork (tests only); image-webp and tiff use quick-error 2" },
  { crate = "syn@2.0.119", reason = "zerocopy-derive (through half and ppv-lite86); serde and thiserror use syn 3" },
  # Font stack (astudio-text, P2-04), the same pairs as in VectorCraft's own lock file:
  { crate = "skrifa@0.42.1", reason = "subsetter 0.2 (font subsets for PDF/SVG); A-Studio uses skrifa 0.47" },
  { crate = "read-fonts@0.39.2", reason = "skrifa 0.42 (subsetter) and write-fonts 0.48" },
  { crate = "read-fonts@0.43.3", reason = "harfrust 0.13; skrifa 0.47 uses read-fonts 0.44" },
  { crate = "font-types@0.11.3", reason = "read-fonts 0.39 (subsetter, write-fonts)" },
  # The vector renderer (astudio-render, P2-14): vello_cpu 0.2 reads glyphs with skrifa 0.44, as in
  # VectorCraft's lock file.
  { crate = "skrifa@0.44.0", reason = "vello_cpu 0.2 through glifo 0.3; A-Studio uses skrifa 0.47" },
  { crate = "read-fonts@0.41.0", reason = "skrifa 0.44 (glifo 0.3, vello_cpu 0.2)" },
  # The importers (P2-15), pairs also in VectorCraft's lock file. hayro-jbig2 is held at 0.3.0 in
  # Cargo.lock (0.3.1 adds second fearless_simd and hayro-ccitt versions; docs/03-dependencies.md).
  { crate = "base64@0.22.1", reason = "krilla 0.8 (PDF export); usvg 0.48 uses base64 0.23" },
  { crate = "harfrust@0.12.0", reason = "usvg 0.48 (SVG import); astudio-text uses harfrust 0.13" },
  { crate = "imagesize@0.14.0", reason = "krilla 0.8 (PDF export); usvg 0.48 uses imagesize 0.15" },
]

[advisories]
yanked = "deny"
ignore = [
  # paste is unmaintained (no known vulnerability): a build-time macro inside pulp, which exr (EXR
  # images in astudio-codecs, P2-11) uses, and inside rav1e (the optional AVIF encoder). Drop when
  # both move off it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro via exr -> pulp and rav1e; no vulnerability" },
  # rustybuzz and ttf-parser are unmaintained (no known vulnerability): krilla 0.8, the PDF writer of
  # astudio-pdf (P2-15), shapes and reads fonts with them, as in VectorCraft. No krilla release
  # moves off them yet; drop when one does.
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained, via krilla 0.8 (PDF export); no vulnerability" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, via rustybuzz (krilla 0.8); no vulnerability" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
