# cargo deny check  (https://github.com/EmbarkStudios/cargo-deny)
[graph]
all-features = true

[licenses]
# Licences that appear in the two upstream dependency trees (see their NOTICE files) and are
# compatible with shipping A-Studio under MIT OR Apache-2.0.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "BSL-1.0", "Unicode-3.0", "CC0-1.0", "OFL-1.1", "MPL-2.0", "IJG",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between A-Studio's own unpublished crates carry no version; that is not a
# wildcard on crates.io. Approved by the owner on 8 October 2026.
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
