# A-Studio P1 prototype (throwaway). Not part of the main workspace and not shipped.
# Needs scripts/bootstrap.sh first: it uses the upstream clones in ../upstream by path.
# Owner decision (8 Oct 2026): prove the vector layer here; port for real in P2/P3 only if GO.
[workspace]
resolver = "3"
# pc-format joins in P1-03 (it needs the Vector arms that task adds).
members = ["pc-doc", "pc-vector", "pc-compose", "vlayer", "p1-check"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rayon = "1"
proptest = "1"
kurbo = { version = "0.13", features = ["serde"] }
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
panic = "unwind"
debug = "line-tables-only"
