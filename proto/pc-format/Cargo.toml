[package]
name = "proto-pc-format"
publish.workspace = true
description = "Native .pcraft document bundle: manifest + content-addressed zstd tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Keeps the upstream crate name in code, so the copied files need no renames.
[lib]
name = "photocraft_format"

[lints]
workspace = true

[dependencies]
# A-Studio P1: Vector layers are stored as .vectorcraft v3 subtrees.
vectorcraft-format = { path = "../../upstream/vectorcraft/crates/format" }
vectorcraft-doc = { path = "../../upstream/vectorcraft/crates/doc" }
photocraft-geom = { path = "../../upstream/photocraft/crates/geom" }
photocraft-color = { path = "../../upstream/photocraft/crates/color" }
photocraft-raster = { path = "../../upstream/photocraft/crates/raster" }
photocraft-doc = { package = "proto-pc-doc", path = "../pc-doc" }
photocraft-codecs = { path = "../../upstream/photocraft/crates/codecs" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
flate2 = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
ruzstd = "0.9"

[dev-dependencies]
proptest = { workspace = true }
