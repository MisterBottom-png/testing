name: Update drum kit agent toolchain guidance

on:
  push:
    branches:
      - agent/drum-kit-ui-redesign-phase1

permissions:
  contents: write

jobs:
  update-guidance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/drum-kit-ui-redesign-phase1

      - name: Update toolchain guidance
        shell: python
        run: |
          from pathlib import Path

          source = Path("drum-kit-android/AGENTS.md")
          text = source.read_text(encoding="utf-8")
          old_versions = (
              "- JDK 17\n"
              "- Android SDK 36\n"
              "- Android Gradle Plugin 8.13.x\n"
              "- Gradle 8.13\n"
              "- NDK 27.0.12077973\n"
              "- CMake 3.22.1\n"
              "- Kotlin 2.3.x\n"
              "- C++20\n"
              "- Oboe 1.10.x"
          )
          new_versions = (
              "- JDK 17\n"
              "- Android SDK 36\n"
              "- Android SDK Build Tools 36.0.0\n"
              "- Android Gradle Plugin 9.3.x\n"
              "- Gradle 9.5.0\n"
              "- NDK 28.2.13676358\n"
              "- CMake 3.22.1\n"
              "- Kotlin 2.4.x through Android Gradle Plugin built-in Kotlin support\n"
              "- C++20\n"
              "- Oboe 1.10.x"
          )
          replacements = {
              old_versions: new_versions,
              "gradle --no-daemon :app:assembleDebug :app:lintDebug": (
                  "gradle --no-daemon --warning-mode=fail "
                  ":app:assembleDebug :app:lintDebug"
              ),
              "gradle --no-daemon :app:assembleRelease :app:lintRelease": (
                  "gradle --no-daemon --warning-mode=fail "
                  ":app:assembleRelease :app:lintRelease"
              ),
              "gradle --no-daemon testDebugUnitTest": (
                  "gradle --no-daemon --warning-mode=fail testDebugUnitTest"
              ),
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence of: {old!r}")
              text = text.replace(old, new)

          source.write_text(text, encoding="utf-8")

      - name: Commit guidance update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/drum-kit-update-agent-toolchain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/drum-kit-update-agent-toolchain.yml \
            drum-kit-android/AGENTS.md
          git commit -m "Update Android toolchain guidance"
          git push origin HEAD:agent/drum-kit-ui-redesign-phase1
