name: Apply Gemini modular extraction

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-gemini-modular-extraction.yml
      - .github/scripts/apply-gemini-modular-extraction.cjs
      - .github/tmp/gemini-module-support.part-*

concurrency:
  group: gemini-modular-extraction
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source
          fetch-depth: 0

      - name: Preserve reference hashes
        run: |
          sha256sum gemini-podcast-studio/dist/gemini-podcast-studio.html > /tmp/dist.before
          find gemini-podcast-studio/src/styles -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/styles.before

      - name: Install extraction parser
        run: npm install --no-save --no-package-lock --prefix /tmp/gemini-tools typescript@5

      - name: Reconstruct verified support archive
        run: |
          cat .github/tmp/gemini-module-support.part-* | base64 --decode > /tmp/gemini-module-support.zip
          unzip -t /tmp/gemini-module-support.zip

      - name: Extract ES modules mechanically
        env:
          NODE_PATH: /tmp/gemini-tools/node_modules
        run: node .github/scripts/apply-gemini-modular-extraction.cjs

      - name: Apply verified tests and documentation
        run: |
          rm -rf gemini-podcast-studio/tests
          unzip -oq /tmp/gemini-module-support.zip -d gemini-podcast-studio

      - name: Confirm protected references are unchanged
        run: |
          sha256sum --check /tmp/dist.before
          find gemini-podcast-studio/src/styles -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/styles.after
          diff -u /tmp/styles.before /tmp/styles.after

      - name: Install application dependencies
        working-directory: gemini-podcast-studio
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: gemini-podcast-studio
        run: |
          for file in src/js/*.js tests/*.mjs vite.config.js; do node --check "$file"; done

      - name: Build through Vite
        working-directory: gemini-podcast-studio
        run: npm run build

      - name: Run full test suite
        working-directory: gemini-podcast-studio
        run: npm test

      - name: Smoke-test Vite preview
        working-directory: gemini-podcast-studio
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gemini-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill ${preview_pid} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/gemini-index.html; then
              break
            fi
            sleep 1
          done
          grep -q 'Podcast Studio' /tmp/gemini-index.html
          grep -q 'type="module"' /tmp/gemini-index.html

      - name: Remove generated and temporary files
        run: |
          rm -rf gemini-podcast-studio/node_modules gemini-podcast-studio/.vite-build
          rm -f gemini-podcast-studio/package-lock.json
          rm -f .github/scripts/analyse-gemini-modules.mjs
          rm -f .github/workflows/gemini-module-analysis.yml
          rm -f .github/workflows/gemini-module-tooling.yml
          rm -f .github/scripts/apply-gemini-modular-extraction.cjs
          rm -f .github/workflows/apply-gemini-modular-extraction.yml
          rm -f .github/tmp/gemini-module-support.zip
          rm -f .github/tmp/gemini-module-support.part-*
          rmdir .github/tmp 2>/dev/null || true

      - name: Commit verified extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Gemini Podcast Studio ES modules"
          git push origin HEAD:agent/gemini-podcast-modular-source
