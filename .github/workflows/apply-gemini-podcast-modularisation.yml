name: Apply Gemini Podcast Studio modularisation

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - scripts/apply-gemini-podcast-modularisation.py
      - .github/workflows/apply-gemini-podcast-modularisation.yml

permissions:
  contents: write

jobs:
  modularise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate modular source
        run: python scripts/apply-gemini-podcast-modularisation.py

      - name: Validate extraction and single-file build
        working-directory: gemini-podcast-studio
        run: npm run check

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-gemini-podcast-modularisation.py
          git rm .github/workflows/apply-gemini-podcast-modularisation.yml
          git add gemini-podcast-studio
          git commit -m "Split podcast studio into modular source files"
          git push origin HEAD:agent/gemini-podcast-modular-source
