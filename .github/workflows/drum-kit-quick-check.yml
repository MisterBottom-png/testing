name: Drum Kit Quick Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - "tools/apply_modernization_m1_m2.py"
      - ".github/workflows/drum-kit-quick-check.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"

concurrency:
  group: drum-kit-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quick-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/drum-kit-ui-redesign-phase1

      - name: Apply modernization M1 and M2
        working-directory: .
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_modernization_m1_m2.py")
          text = path.read_text(encoding="utf-8")
          old = '    if workflow.name == "drum-kit-quick-check.yml":\n        text = replace_once(text, ":engine-input:compileDebugKotlin", ":engine-input:testDebugUnitTest", "quick-check engine-input tests")\n'
          new = '    if workflow.name == "drum-kit-quick-check.yml":\n        if ":engine-input:testDebugUnitTest" in text:\n            pass\n        elif ":engine-input:compileDebugKotlin" in text:\n            text = replace_once(text, ":engine-input:compileDebugKotlin", ":engine-input:testDebugUnitTest", "quick-check engine-input tests")\n        else:\n            raise RuntimeError("quick-check engine-input tests: expected compile or test task")\n'
          if text.count(old) != 1:
              raise RuntimeError("modernization runner guard anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 tools/apply_modernization_m1_m2.py 2>&1 | tee modernization-patch.log

      - name: Upload modernization patch log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modernization-patch-log
          path: modernization-patch.log
          if-no-files-found: error
          retention-days: 2

      - name: Commit modernization M1 and M2
        working-directory: .
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            if git diff --quiet; then
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              drum-kit-android/AGENTS.md \
              drum-kit-android/README.md \
              drum-kit-android/app/build.gradle.kts \
              drum-kit-android/app/src/main/java/com/vitautas/drumkit/MainActivity.kt \
              drum-kit-android/build.gradle.kts \
              drum-kit-android/core-model/build.gradle.kts \
              drum-kit-android/docs/source-mapping.md \
              drum-kit-android/engine-audio/build.gradle.kts \
              drum-kit-android/engine-audio/src/main/cpp/native-audio.cpp \
              drum-kit-android/engine-input/build.gradle.kts \
              drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/CachedArtworkLayer.kt \
              drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/DrumSurfaceView.kt \
              drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/LayeredInstrumentArtwork.kt \
              drum-kit-android/feature-kit/build.gradle.kts \
              drum-kit-android/feature-kit/src/main/java/com/vitautas/drumkit/feature/kit/DrumKitScreen.kt \
              drum-kit-android/gradle.properties \
              drum-kit-android/gradle/libs.versions.toml
            git diff --cached --check
            git commit -m "Modernize Android baseline and complete Step 2.6"
            git push origin HEAD:agent/drum-kit-ui-redesign-phase1
          } 2>&1 | tee modernization-commit.log

      - name: Upload modernization commit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modernization-commit-log
          path: modernization-commit.log
          if-no-files-found: warn
          retention-days: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Compile Kotlin and run unit tests
        run: >-
          gradle --no-daemon --console=plain --warning-mode=fail
          :core-model:testDebugUnitTest
          :engine-input:testDebugUnitTest
          :engine-audio:testDebugUnitTest
          :feature-kit:testDebugUnitTest
          :app:compileDebugKotlin
