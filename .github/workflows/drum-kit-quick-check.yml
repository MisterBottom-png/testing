name: Drum Kit Quick Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - "tools/apply_final_modernization_cleanup.py"
      - ".github/workflows/drum-kit-quick-check.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"

concurrency:
  group: drum-kit-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quick-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/drum-kit-ui-redesign-phase1

      - name: Apply final modernization cleanup
        working-directory: .
        run: python3 tools/apply_final_modernization_cleanup.py

      - name: Commit final modernization cleanup
        working-directory: .
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drum-kit-android/AGENTS.md \
            drum-kit-android/docs/source-mapping.md \
            drum-kit-android/feature-kit/src/main/java/com/vitautas/drumkit/feature/kit/DrumKitScreen.kt
          git diff --cached --check
          git commit -m "Respect adaptive window safe areas"
          git push origin HEAD:agent/drum-kit-ui-redesign-phase1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install compile SDK
        shell: bash
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Compile Kotlin and run unit tests
        run: >-
          gradle --no-daemon --console=plain --warning-mode=fail
          :core-model:testDebugUnitTest
          :engine-input:testDebugUnitTest
          :engine-audio:testDebugUnitTest
          :feature-kit:testDebugUnitTest
          :app:compileDebugKotlin
