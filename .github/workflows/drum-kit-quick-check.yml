name: Drum Kit Quick Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"

concurrency:
  group: drum-kit-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Compile Kotlin and run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --warning-mode=fail \
            :core-model:testDebugUnitTest \
            :engine-input:compileDebugKotlin \
            :engine-audio:testDebugUnitTest \
            :feature-kit:testDebugUnitTest \
            :app:compileDebugKotlin 2>&1 | tee ../step-2-5-quick-check.log

      - name: Upload Step 2.5 compile diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: step-2-5-quick-check-log
          path: step-2-5-quick-check.log
          if-no-files-found: ignore
          retention-days: 1
