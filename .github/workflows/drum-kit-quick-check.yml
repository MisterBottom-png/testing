name: Drum Kit Quick Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"

concurrency:
  group: drum-kit-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quick-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Apply pending Step 2.4 implementation
        if: github.event_name == 'pull_request' && hashFiles('drum-kit-android/tools/apply_step_2_4.py') != ''
        working-directory: .
        run: python drum-kit-android/tools/apply_step_2_4.py

      - name: Commit pending Step 2.4 implementation
        if: github.event_name == 'pull_request' && hashFiles('drum-kit-android/tools/apply_step_2_4.py') != ''
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drum-kit-android/core-model/src/main/java/com/vitautas/drumkit/model/KitModels.kt \
            drum-kit-android/core-model/src/test/java/com/vitautas/drumkit/model/RenderLayerTest.kt \
            drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/DrumSurfaceView.kt \
            drum-kit-android/docs/source-mapping.md \
            drum-kit-android/README.md
          if git diff --cached --quiet; then
            echo "Step 2.4 source is already committed."
            exit 0
          fi
          git commit -m "Implement Step 2.4 hardware occlusion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Compile Kotlin and run unit tests
        run: >-
          gradle --no-daemon --console=plain --warning-mode=fail
          :core-model:testDebugUnitTest
          :engine-input:compileDebugKotlin
          :engine-audio:testDebugUnitTest
          :feature-kit:testDebugUnitTest
          :app:compileDebugKotlin
