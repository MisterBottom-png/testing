name: Drum Kit Quick Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"

concurrency:
  group: drum-kit-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quick-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Apply pending Step 2.4 implementation
        id: apply-occlusion
        if: github.event_name == 'pull_request' && hashFiles('drum-kit-android/tools/apply_step_2_4.py') != ''
        continue-on-error: true
        working-directory: .
        shell: bash
        run: |
          set -o pipefail
          python drum-kit-android/tools/apply_step_2_4.py 2>&1 | tee step-2-4-patch.log

      - name: Upload Step 2.4 patch diagnostics
        if: steps.apply-occlusion.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: step-2-4-patch-log
          path: step-2-4-patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit pending Step 2.4 implementation
        if: steps.apply-occlusion.outcome == 'success' && hashFiles('drum-kit-android/tools/apply_step_2_4.py') != ''
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drum-kit-android/core-model/src/main/java/com/vitautas/drumkit/model/KitModels.kt \
            drum-kit-android/core-model/src/test/java/com/vitautas/drumkit/model/RenderLayerTest.kt \
            drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/DrumSurfaceView.kt \
            drum-kit-android/docs/source-mapping.md \
            drum-kit-android/README.md
          if git diff --cached --quiet; then
            echo "Step 2.4 source is already committed."
            exit 0
          fi
          git commit -m "Implement Step 2.4 hardware occlusion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-java@v5
        if: steps.apply-occlusion.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.apply-occlusion.outcome == 'success'
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        if: steps.apply-occlusion.outcome == 'success'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.apply-occlusion.outcome == 'success'
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Compile Kotlin and run unit tests
        if: steps.apply-occlusion.outcome == 'success'
        run: >-
          gradle --no-daemon --console=plain --warning-mode=fail
          :core-model:testDebugUnitTest
          :engine-input:compileDebugKotlin
          :engine-audio:testDebugUnitTest
          :feature-kit:testDebugUnitTest
          :app:compileDebugKotlin
