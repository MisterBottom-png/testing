name: Drum Kit Quick Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - "tools/apply_pre_2_6_corrections.py"
      - ".github/workflows/drum-kit-quick-check.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"

concurrency:
  group: drum-kit-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quick-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/drum-kit-ui-redesign-phase1

      - name: Apply pre-2.6 corrections
        working-directory: .
        run: python3 tools/apply_pre_2_6_corrections.py

      - name: Commit pre-2.6 corrections
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drum-kit-android/AGENTS.md \
            drum-kit-android/README.md \
            drum-kit-android/core-model/src/main/java/com/vitautas/drumkit/model/KitModels.kt \
            drum-kit-android/core-model/src/test/java/com/vitautas/drumkit/model/HitRegionTest.kt \
            drum-kit-android/docs/source-mapping.md \
            drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/DrumSurfaceView.kt
          git diff --cached --check
          git commit -m "Fix pre-2.6 geometry and cache regressions"
          git push origin HEAD:agent/drum-kit-ui-redesign-phase1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Compile Kotlin and run unit tests
        run: >-
          gradle --no-daemon --console=plain --warning-mode=fail
          :core-model:testDebugUnitTest
          :engine-input:compileDebugKotlin
          :engine-audio:testDebugUnitTest
          :feature-kit:testDebugUnitTest
          :app:compileDebugKotlin
