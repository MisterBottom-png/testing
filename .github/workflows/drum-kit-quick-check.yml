name: Drum Kit Quick Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-quick-check.yml"

concurrency:
  group: drum-kit-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quick-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Apply pending Step 2.3 implementation
        id: apply-depth
        if: github.event_name == 'pull_request' && hashFiles('.github/workflows/drum-kit-step-2-3-depth.yml') != ''
        continue-on-error: true
        working-directory: .
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee step-2-3-patch.log
          from pathlib import Path

          workflow = Path(".github/workflows/drum-kit-step-2-3-depth.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "        run: |\n"
          end_marker = "\n      - name: Commit Step 2.3 and remove temporary workflow"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script_lines = []
          for line in workflow[start:end].splitlines():
              if not line:
                  script_lines.append("")
              elif line.startswith("          "):
                  script_lines.append(line[10:])
              else:
                  raise SystemExit(f"Unexpected patch indentation: {line!r}")
          script = "\n".join(script_lines) + "\n"
          exec(compile(script, "apply_step_2_3.py", "exec"))
          PY

      - name: Upload Step 2.3 patch diagnostics
        if: steps.apply-depth.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: step-2-3-patch-log
          path: step-2-3-patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit pending Step 2.3 implementation
        if: steps.apply-depth.outcome == 'success' && hashFiles('.github/workflows/drum-kit-step-2-3-depth.yml') != ''
        working-directory: .
        shell: bash
        run: |
          cat > .github/workflows/drum-kit-quick-check.yml <<'WORKFLOW'
          name: Drum Kit Quick Check

          on:
            pull_request:
              types:
                - opened
                - synchronize
                - reopened
                - ready_for_review
              paths:
                - "drum-kit-android/**"
                - ".github/workflows/drum-kit-quick-check.yml"
            push:
              branches:
                - main
              paths:
                - "drum-kit-android/**"
                - ".github/workflows/drum-kit-quick-check.yml"

          concurrency:
            group: drum-kit-quick-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          permissions:
            contents: read

          jobs:
            quick-check:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: drum-kit-android

              steps:
                - uses: actions/checkout@v6

                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: "17"

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v4

                - name: Install compile SDK
                  shell: bash
                  run: |
                    yes | sdkmanager --licenses >/dev/null || true
                    sdkmanager \
                      "platforms;android-36" \
                      "build-tools;36.0.0"

                - uses: gradle/actions/setup-gradle@v6
                  with:
                    gradle-version: "9.5.0"
                    cache-provider: basic

                - name: Compile Kotlin and run unit tests
                  run: >-
                    gradle --no-daemon --console=plain --warning-mode=fail
                    :core-model:testDebugUnitTest
                    :engine-input:compileDebugKotlin
                    :engine-audio:testDebugUnitTest
                    :feature-kit:testDebugUnitTest
                    :app:compileDebugKotlin
          WORKFLOW
          sed -i 's/^          //' .github/workflows/drum-kit-quick-check.yml
          rm .github/workflows/drum-kit-step-2-3-depth.yml
          rm drum-kit-android/.step-2-3-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/drum-kit-quick-check.yml \
            .github/workflows/drum-kit-step-2-3-depth.yml \
            drum-kit-android/.step-2-3-trigger \
            drum-kit-android/core-model/src/main/java/com/vitautas/drumkit/model/KitCamera.kt \
            drum-kit-android/core-model/src/main/java/com/vitautas/drumkit/model/KitModels.kt \
            drum-kit-android/core-model/src/test/java/com/vitautas/drumkit/model/HitRegionTest.kt \
            drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/DrumSurfaceView.kt \
            drum-kit-android/docs/source-mapping.md
          git commit -m "Implement Step 2.3 depth relationships"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-java@v5
        if: steps.apply-depth.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.apply-depth.outcome == 'success'
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        if: steps.apply-depth.outcome == 'success'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.apply-depth.outcome == 'success'
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Compile Kotlin and run unit tests
        if: steps.apply-depth.outcome == 'success'
        run: >-
          gradle --no-daemon --console=plain --warning-mode=fail
          :core-model:testDebugUnitTest
          :engine-input:compileDebugKotlin
          :engine-audio:testDebugUnitTest
          :feature-kit:testDebugUnitTest
          :app:compileDebugKotlin
