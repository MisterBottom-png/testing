name: Gemini module tooling

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - .github/workflows/gemini-module-tooling.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-module-tooling.yml

permissions:
  contents: read

jobs:
  package-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        working-directory: gemini-podcast-studio
        run: npm install --no-audit --no-fund
      - name: Upload project dependencies
        uses: actions/upload-artifact@v4
        with:
          name: gemini-vite-dependencies
          path: gemini-podcast-studio/node_modules
          include-hidden-files: true
          if-no-files-found: error
