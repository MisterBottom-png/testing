name: Gemini Podcast Studio voice preview check

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - gemini-podcast-studio/.run-voice-preview-check

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source

      - name: Add preview module to source order
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('gemini-podcast-studio/src/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '  <script defer src="./js/ui-events.js"></script>\n'
          addition = marker + '  <script defer src="./js/voice-preview.js"></script>\n'
          if './js/voice-preview.js' not in text:
              if marker not in text:
                  raise SystemExit('ui-events script marker not found')
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: gemini-podcast-studio
        run: npm install --no-audit --no-fund

      - name: Build, verify and test
        working-directory: gemini-podcast-studio
        run: npm run check

      - name: Commit validated source and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini-podcast-studio/src/index.html gemini-podcast-studio/dist/gemini-podcast-studio.html
          if git diff --cached --quiet; then
            echo "Source order and generated distribution are already current."
          else
            git commit -m "Wire cached Gemini voice previews"
            git push
          fi
