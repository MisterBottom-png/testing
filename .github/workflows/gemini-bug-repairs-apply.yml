name: Apply Gemini Podcast Studio bug repairs

on:
  pull_request:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - .github/workflows/gemini-bug-repairs-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-podcast-bug-repairs
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-bug-repairs
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: gemini-podcast-studio
        run: npm install --no-audit --no-fund

      - name: Verify regression suite is RED before repair
        working-directory: gemini-podcast-studio
        shell: bash
        run: |
          mkdir -p docs/superpowers/evidence
          set +e
          node --test tests/bug-repairs.test.mjs > docs/superpowers/evidence/2026-07-28-bug-repairs-red.txt 2>&1
          status=$?
          set -e
          cat docs/superpowers/evidence/2026-07-28-bug-repairs-red.txt
          if [ "$status" -eq 0 ]; then
            echo "Regression suite unexpectedly passed before production changes." >&2
            exit 1
          fi

      - name: Decode and apply repair patch
        shell: bash
        run: |
          cat .github/repair-payload/gemini-bug-repairs.py.gz.b64.part-* > /tmp/gemini-bug-repairs.py.gz.b64
          base64 -d /tmp/gemini-bug-repairs.py.gz.b64 | gzip -d > /tmp/gemini-bug-repairs.py
          echo '9b6652c2e969f0836f221862f4ece8e6ff5671c66ac585370c3887786e7ea0c0  /tmp/gemini-bug-repairs.py' | sha256sum --check
          cd gemini-podcast-studio
          python /tmp/gemini-bug-repairs.py

      - name: Check JavaScript syntax
        working-directory: gemini-podcast-studio
        shell: bash
        run: |
          for file in src/js/*.js tests/*.mjs scripts/*.mjs vite.config.js; do
            node --check "$file"
          done

      - name: Verify focused regressions are GREEN
        working-directory: gemini-podcast-studio
        shell: bash
        run: |
          node --test tests/bug-repairs.test.mjs 2>&1 | tee docs/superpowers/evidence/2026-07-28-bug-repairs-green.txt

      - name: Run complete verification gate
        working-directory: gemini-podcast-studio
        shell: bash
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm run check 2>&1 | tee docs/superpowers/evidence/2026-07-28-bug-repairs-full-verification.txt

      - name: Check repository diff
        run: git diff --check

      - name: Upload repaired source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-bug-repair-workspace
          path: |
            gemini-podcast-studio/src/
            gemini-podcast-studio/tests/
            gemini-podcast-studio/scripts/
            gemini-podcast-studio/package.json
            gemini-podcast-studio/dist/
            gemini-podcast-studio/docs/superpowers/evidence/
          if-no-files-found: warn

      - name: Commit verified repairs
        shell: bash
        run: |
          rm -rf .github/repair-payload
          rm -f .github/workflows/gemini-bug-repairs-apply.yml .github/workflows/gemini-bug-repairs-red.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair Gemini Podcast Studio runtime defects'
          git push origin HEAD:agent/gemini-podcast-bug-repairs
