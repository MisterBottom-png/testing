name: ci
on:
  push:
  workflow_dispatch:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A-Studio targets Windows only (D7 in docs/00-decisions.md).
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # craft-fonts (OFL, never in this repo) at the commit the golden paragraphs were made with:
      # the tests of Japanese, Chinese and Arabic text run with it (P2-10).
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      - run: cargo test --workspace
      # Only the text crate with the fonts embedded: every test binary of the workspace would
      # carry them (about 40 MB each).
      - run: cargo test -p astudio-text
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      - run: cargo xtask layers
      - run: cargo xtask assets
      - name: Web build (L0 to L6)
        run: cargo check --workspace --target wasm32-unknown-unknown --exclude a-studio --exclude a-studio-cli --exclude xtask --exclude astudio-testkit
      - name: Rebrand scan
        shell: bash
        run: scripts/rebrand-scan.sh --shipped

  # cargo-deny runs in a Linux container; it only checks licences and sources.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
