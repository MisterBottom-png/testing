name: Drum Kit APK

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

concurrency:
  group: drum-kit-apk-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-apk:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-apk'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Test, build debug APK, and lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --warning-mode=fail \
            testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug 2>&1 | tee apk-build.log

      - name: Upload APK build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drum-kit-apk-build-log
          path: drum-kit-android/apk-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: drum-kit-debug-apk
          path: drum-kit-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drum-kit-lint-reports
          path: drum-kit-android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove APK request label
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'build-apk',
              })
            } catch (error) {
              if (error.status !== 404) throw error
            }
