name: Drum Kit APK

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

concurrency:
  group: drum-kit-apk-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-apk:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-apk'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-37.0"
          test -d "$sdk_root/build-tools/37.0.0"
          test -d "$sdk_root/ndk/29.0.14206865"
          test -x "$sdk_root/cmake/3.31.5/bin/cmake"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-cleanup: on-success

      - name: Build arm64 debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --warning-mode=fail \
            -PdrumKitAbis=arm64-v8a \
            -PdrumKitCmakeVersion=3.31.5 \
            :app:assembleDebug 2>&1 | tee apk-build.log

      - name: Upload APK build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drum-kit-apk-build-log
          path: drum-kit-android/apk-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: drum-kit-debug-apk
          path: drum-kit-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove APK request label
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'build-apk',
              })
            } catch (error) {
              if (error.status !== 404) throw error
            }
