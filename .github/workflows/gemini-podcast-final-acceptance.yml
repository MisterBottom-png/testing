name: Gemini Podcast Studio final acceptance

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - gemini-podcast-studio/.run-final-acceptance

permissions:
  contents: write

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: gemini-podcast-studio
        run: npm install --no-audit --no-fund

      - name: Validate and publish result
        run: |
          set +e
          cd gemini-podcast-studio
          {
            echo "## JavaScript syntax"
            for file in src/js/*.js; do node --check "$file" || exit 91; done
            echo "## Production build, verification and tests"
            npm run check
          } > final-acceptance.log 2>&1
          status=$?
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            {
              echo "status=$status"
              echo
              tail -n 240 gemini-podcast-studio/final-acceptance.log
            } > gemini-podcast-studio/final-acceptance-failure.txt
            rm -f gemini-podcast-studio/final-acceptance.log
            git add gemini-podcast-studio/final-acceptance-failure.txt
            git commit -m "Record Gemini Podcast Studio acceptance failure"
            git push
            exit 0
          fi

          rm -f gemini-podcast-studio/final-acceptance-failure.txt gemini-podcast-studio/final-acceptance.log
          git add gemini-podcast-studio/dist/gemini-podcast-studio.html gemini-podcast-studio/final-acceptance-failure.txt
          if git diff --cached --quiet; then
            echo "Production build and full test suite passed; generated output is current."
          else
            git commit -m "Refresh accepted Gemini Podcast Studio build"
            git push
          fi
