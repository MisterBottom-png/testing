name: Gemini Podcast Studio final acceptance

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - gemini-podcast-studio/.run-final-acceptance
  pull_request:
    branches:
      - main
    paths:
      - gemini-podcast-studio/**
      - .github/workflows/gemini-podcast-final-acceptance.yml

permissions:
  contents: write

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: gemini-podcast-studio
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: gemini-podcast-studio
        run: |
          for file in src/js/*.js; do node --check "$file"; done

      - name: Build, verify and run full test suite
        working-directory: gemini-podcast-studio
        run: npm run check

      - name: Commit refreshed production build
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini-podcast-studio/dist/gemini-podcast-studio.html
          if git diff --cached --quiet; then
            echo "Production build is already current."
          else
            git commit -m "Refresh accepted Gemini Podcast Studio build"
            git push
          fi
