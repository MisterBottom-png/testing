name: Apply Gemini model configuration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-apply-model-config.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct verified test and implementation payloads
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/model-config-reconstruct.log) 2>&1
          git fetch --quiet origin agent/gemini-model-config-staging:refs/remotes/origin/agent/gemini-model-config-staging
          git checkout --quiet origin/agent/gemini-model-config-staging -- .github/tmp
          find .github/tmp -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          cat .github/tmp/model-config-test.part-* > /tmp/model-configuration.test.mjs.b64
          test_bytes=$(wc -c < /tmp/model-configuration.test.mjs.b64)
          echo "test-encoded-bytes=$test_bytes"
          test "$test_bytes" -eq 9804
          base64 --decode /tmp/model-configuration.test.mjs.b64 > /tmp/model-configuration.test.mjs
          test_sha=$(sha256sum /tmp/model-configuration.test.mjs | cut -d' ' -f1)
          echo "test-sha=$test_sha"
          test "$test_sha" = "3b3b6652ab775def7bd65b65821ac770550d413f0cae22723e1034a2cfaae43f"

          cat .github/tmp/model-config-apply.part-* > /tmp/apply-model-config.py.b64
          apply_bytes=$(wc -c < /tmp/apply-model-config.py.b64)
          echo "apply-encoded-bytes=$apply_bytes"
          test "$apply_bytes" -eq 38388
          base64 --decode /tmp/apply-model-config.py.b64 > /tmp/apply-model-config.py
          apply_sha=$(sha256sum /tmp/apply-model-config.py | cut -d' ' -f1)
          echo "apply-original-sha=$apply_sha"
          test "$apply_sha" = "8e0194b84ff37039921f5cacd28d36015b3150e03a78bbd0aa11b2f735acaa8e"

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-model-config.py')
          source = path.read_text()

          old_script_patch = """replace_once('src/js/script-generation.js', 'services.callGeminiText({', 'services.generateStructuredScript({')
          replace_once('src/js/script-generation.js', 'services.callGeminiText({', 'services.generateStructuredScript({')
          """
          new_script_patch = """script_generation = read('src/js/script-generation.js')
          old_transport_call = 'services.callGeminiText({'
          new_transport_call = 'services.generateStructuredScript({'
          if script_generation.count(old_transport_call) != 2:
              raise SystemExit(f\"src/js/script-generation.js: expected two Gemini transport calls, found {script_generation.count(old_transport_call)}\")
          write('src/js/script-generation.js', script_generation.replace(old_transport_call, new_transport_call))
          """
          if source.count(old_script_patch) != 1:
              raise SystemExit(f'Expected one legacy script transport patch block, found {source.count(old_script_patch)}.')
          source = source.replace(old_script_patch, new_script_patch, 1)

          old_jobs_patch = """replace_once('src/js/generation-jobs.js', "    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(services.getTtsModel())}:generateContent`;\\n", '')
          replace_once('src/js/generation-jobs.js', 'result = await services.requestTtsChunk(endpoint, chunk.transcript, speakerVoiceConfigs);', 'result = await services.generateTtsPcm({ transcript: chunk.transcript, speakerVoiceConfigs });')"""
          new_jobs_patch = """generation_jobs = read('src/js/generation-jobs.js')
          tts_endpoint_line = "    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(services.getTtsModel())}:generateContent`;\\n"
          if generation_jobs.count(tts_endpoint_line) != 2:
              raise SystemExit(f\"src/js/generation-jobs.js: expected two existing TTS endpoint paths, found {generation_jobs.count(tts_endpoint_line)}\")
          generation_jobs = generation_jobs.replace(tts_endpoint_line, '', 1)
          old_chunk_request = 'result = await services.requestTtsChunk(endpoint, chunk.transcript, speakerVoiceConfigs);'
          new_chunk_request = 'result = await services.generateTtsPcm({ transcript: chunk.transcript, speakerVoiceConfigs });'
          if generation_jobs.count(old_chunk_request) != 1:
              raise SystemExit(f\"src/js/generation-jobs.js: expected one episode TTS request call, found {generation_jobs.count(old_chunk_request)}\")
          write('src/js/generation-jobs.js', generation_jobs.replace(old_chunk_request, new_chunk_request, 1))"""
          if source.count(old_jobs_patch) != 1:
              raise SystemExit(f'Expected one legacy generation-jobs patch block, found {source.count(old_jobs_patch)}.')
          path.write_text(source.replace(old_jobs_patch, new_jobs_patch, 1))
          PY
          corrected_sha=$(sha256sum /tmp/apply-model-config.py | cut -d' ' -f1)
          echo "apply-corrected-sha=$corrected_sha"
          test "$corrected_sha" = "0a142e428616ce0b746e2006486f8b8ccb1aa08f20444f4f9fdda37c00ecc05a"
          python -m py_compile /tmp/apply-model-config.py

      - name: Prove focused tests fail before implementation
        working-directory: gemini-podcast-studio
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/model-configuration.test.mjs tests/model-configuration.test.mjs
          set +e
          node --test tests/model-configuration.test.mjs > /tmp/model-config-red.log 2>&1
          status=$?
          set -e
          cat /tmp/model-config-red.log
          if [ "$status" -eq 0 ]; then
            echo "Focused model-configuration tests unexpectedly passed before implementation."
            exit 1
          fi
          echo "Focused tests failed as expected before implementation."

      - name: Apply model defaults, selectors, migration and transport adapter
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/model-config-apply.log) 2>&1
          python /tmp/apply-model-config.py

          python - <<'PY'
          from pathlib import Path
          path = Path('gemini-podcast-studio/tests/model-configuration.test.mjs')
          source = path.read_text()
          old_harness = """  return withGlobals({
            document: { getElementById() { return createElementStub(); } },
            localStorage,
            sessionStorage,
            matchMedia: () => ({ matches: false })
          }, () => {
            const services = installServices(createServices(), ['constants', 'textUtilities']);
            installState(services);
            installServices(services, ['appHelpers', 'preferences', 'connectionUi']);
            return { services, localStorage };
          });
          """
          new_harness = """  const globals = {
            document: { getElementById() { return createElementStub(); } },
            localStorage,
            sessionStorage,
            matchMedia: () => ({ matches: false })
          };
          return withGlobals(globals, () => {
            const services = installServices(createServices(), ['constants', 'textUtilities']);
            installState(services);
            installServices(services, ['appHelpers', 'preferences', 'connectionUi']);
            return {
              services,
              localStorage,
              loadPreferences: () => withGlobals(globals, () => services.loadPreferences())
            };
          });
          """
          if source.count(old_harness) != 1:
              raise SystemExit(f'Expected one model test harness block, found {source.count(old_harness)}.')
          source = source.replace(old_harness, new_harness, 1)
          old_valid = "  const { services } = await createHarness(saved);\n  const migration = services.loadPreferences();"
          new_valid = "  const { services, loadPreferences } = await createHarness(saved);\n  const migration = await loadPreferences();"
          old_invalid = "  const { services, localStorage } = await createHarness(saved);\n  const migration = services.loadPreferences();"
          new_invalid = "  const { services, localStorage, loadPreferences } = await createHarness(saved);\n  const migration = await loadPreferences();"
          if source.count(old_valid) != 1 or source.count(old_invalid) != 1:
              raise SystemExit('Expected both preference-loading test calls exactly once.')
          path.write_text(source.replace(old_valid, new_valid, 1).replace(old_invalid, new_invalid, 1))
          PY
          test "$(sha256sum gemini-podcast-studio/tests/model-configuration.test.mjs | cut -d' ' -f1)" = "6054ec3a76e71543691d464bd9c915bc7ef6a6ccf4fdb1fab03fbd41f153f697"
          rm -rf .github/tmp

      - name: Run focused and full verification
        working-directory: gemini-podcast-studio
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/model-config-verify.log) 2>&1
          npm install --no-audit --no-fund
          node --test tests/model-configuration.test.mjs tests/project-migration.test.mjs
          npm test
          npm run build
          npm run verify:single
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test -f dist/gemini-podcast-studio.html
          test ! -d .single-file-build
          grep -q "Gemini 3.5 Flash-Lite" dist/gemini-podcast-studio.html
          grep -q "Gemini 3.6 Flash" dist/gemini-podcast-studio.html
          grep -q "Gemini 3.1 Flash TTS Preview" dist/gemini-podcast-studio.html
          grep -q "approximately 420 spoken words" dist/gemini-podcast-studio.html

          npm run dev -- --port 4173 > /tmp/gemini-model-config-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/gemini-model-config-dev.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/gemini-model-config-dev.html
          grep -q 'src="./js/main.js"' /tmp/gemini-model-config-dev.html
          kill "$dev_pid" 2>/dev/null || true
          wait "$dev_pid" 2>/dev/null || true
          trap - EXIT
          git diff --check
          wc -c dist/gemini-podcast-studio.html

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-model-configuration-diagnostics
          path: |
            /tmp/model-config-reconstruct.log
            /tmp/model-config-red.log
            /tmp/model-config-apply.log
            /tmp/model-config-verify.log
            /tmp/gemini-model-config-dev.log
          if-no-files-found: ignore

      - name: Commit verified configuration update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gemini-apply-model-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Gemini model defaults and preferences"
          git push origin HEAD:agent/gemini-podcast-modular-source
          git push origin --delete agent/gemini-model-config-staging || true
