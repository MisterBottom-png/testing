name: Final Gemini production verification

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - .github/workflows/gemini-final-production-verification.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-final-production-verification.yml

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source
          fetch-depth: 1
          show-progress: false

      - name: Verify final standalone application
        working-directory: gemini-podcast-studio
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run verify:single
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test -f dist/gemini-podcast-studio.html
          test ! -d .single-file-build
          output_size=$(wc -c < dist/gemini-podcast-studio.html)
          echo "standalone-output-bytes=$output_size"
          git diff --check

      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp-ignore-test
          rm -f .github/workflows/gemini-final-production-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify standalone podcast studio"
          git push origin HEAD:agent/gemini-podcast-modular-source
          git push origin --delete agent/gemini-production-build-staging || true
