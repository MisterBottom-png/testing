name: Apply Gemini standalone build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-standalone-adopt.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct verified source archives
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/tmp-v2 -type f | wc -l)" = "11"
          cat .github/tmp-v2/standalone-build.part-* > /tmp/gemini-standalone-source.tar.gz.b64
          test "$(wc -c < /tmp/gemini-standalone-source.tar.gz.b64)" = "30576"
          base64 --decode /tmp/gemini-standalone-source.tar.gz.b64 > /tmp/gemini-standalone-source.tar.gz
          test "$(sha256sum /tmp/gemini-standalone-source.tar.gz | cut -d' ' -f1)" = "23006daf4860cd11f4e2809a8eaa36017877b90cbbeb26ef7524c364f2db40ec"
          gzip --test /tmp/gemini-standalone-source.tar.gz
          tar -xzf /tmp/gemini-standalone-source.tar.gz -C gemini-podcast-studio

          test "$(find .github/overlay-v3 -type f | wc -l)" = "5"
          cat .github/overlay-v3/standalone-fix.part-* > /tmp/gemini-standalone-overlay.tar.gz.b64
          test "$(wc -c < /tmp/gemini-standalone-overlay.tar.gz.b64)" = "13412"
          base64 --decode /tmp/gemini-standalone-overlay.tar.gz.b64 > /tmp/gemini-standalone-overlay.tar.gz
          test "$(sha256sum /tmp/gemini-standalone-overlay.tar.gz | cut -d' ' -f1)" = "498c916e8b3e977380678c3acb154b4bec97233b249eadef2b0859d425ea3907"
          gzip --test /tmp/gemini-standalone-overlay.tar.gz
          tar -xzf /tmp/gemini-standalone-overlay.tar.gz -C gemini-podcast-studio

          test "$(find .github/overlay-v4 -type f | wc -l)" = "6"
          cat .github/overlay-v4/standalone-runtime.part-* > /tmp/gemini-standalone-runtime.tar.gz.b64
          test "$(wc -c < /tmp/gemini-standalone-runtime.tar.gz.b64)" = "17368"
          base64 --decode /tmp/gemini-standalone-runtime.tar.gz.b64 > /tmp/gemini-standalone-runtime.tar.gz
          test "$(sha256sum /tmp/gemini-standalone-runtime.tar.gz | cut -d' ' -f1)" = "5a83ae635c24ef4a1e8d457b54c51d7e2ccffdb6dcac39d0a1d0754f0e0abd64"
          gzip --test /tmp/gemini-standalone-runtime.tar.gz
          tar -xzf /tmp/gemini-standalone-runtime.tar.gz -C gemini-podcast-studio

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: gemini-podcast-studio
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: gemini-podcast-studio
        run: |
          for file in src/js/*.js scripts/*.mjs tests/*.mjs vite.config.js; do node --check "$file"; done

      - name: Run source and build tests
        working-directory: gemini-podcast-studio
        run: npm test

      - name: Build verified standalone application
        working-directory: gemini-podcast-studio
        run: |
          npm run build
          npm run verify:single
          test "$(find dist -type f | wc -l)" = "1"
          test -f dist/gemini-podcast-studio.html
          test ! -e .single-file-build

      - name: Run browser runtime verification
        working-directory: gemini-podcast-studio
        shell: bash
        run: |
          set -o pipefail
          chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chromium_path"
          CHROMIUM_PATH="$chromium_path" npm run test:runtime 2>&1 | tee /tmp/gemini-runtime.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-runtime-diagnostics
          path: /tmp/gemini-runtime.log
          if-no-files-found: warn

      - name: Commit generated standalone build
        shell: bash
        run: |
          rm -rf .github/tmp .github/tmp-v2 .github/overlay-v3 .github/overlay-v4
          rm -f .github/workflows/gemini-standalone-adopt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build standalone Gemini Podcast Studio"
          git push origin HEAD:agent/gemini-podcast-modular-source
