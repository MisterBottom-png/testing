name: Export Gemini source

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - .github/workflows/gemini-export-source.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source
          fetch-depth: 1
          show-progress: false

      - name: Package current source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/gemini-podcast-studio-source.tar.gz gemini-podcast-studio
          sha256sum /tmp/gemini-podcast-studio-source.tar.gz

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: gemini-podcast-studio-current-source
          path: /tmp/gemini-podcast-studio-source.tar.gz
          if-no-files-found: error

      - name: Remove export workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gemini-export-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary source export workflow"
          git push origin HEAD:agent/gemini-podcast-modular-source
