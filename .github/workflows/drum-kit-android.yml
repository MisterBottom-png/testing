name: Android Drum Kit CI

on:
  push:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"
  pull_request:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"

jobs:
  inspect-kitty-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Kitty archive link
        run: |
          set -eu
          mkdir -p /tmp/kitty-link
          curl --fail --location --retry 3 \
            'https://www.drumgizmo.org/wiki/doku.php?id=kits:kitty' \
            > /tmp/kitty-link/kitty-page.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href')
                      if href:
                          self.links.append(href)

          parser = Links()
          parser.feed(Path('/tmp/kitty-link/kitty-page.html').read_text(errors='replace'))
          resolved = sorted({urljoin('https://www.drumgizmo.org/wiki/', link) for link in parser.links})
          Path('/tmp/kitty-link/links.txt').write_text('\n'.join(resolved) + '\n')
          likely = [link for link in resolved if any(token in link.lower() for token in ('kitty', '.zip', '.tar', 'download'))]
          Path('/tmp/kitty-link/likely-links.txt').write_text('\n'.join(likely) + '\n')
          PY

      - name: Upload Kitty link metadata
        uses: actions/upload-artifact@v4
        with:
          name: kitty-link-metadata
          path: /tmp/kitty-link
          if-no-files-found: error
