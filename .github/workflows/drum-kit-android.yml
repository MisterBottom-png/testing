name: Android Drum Kit CI

on:
  push:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"
  pull_request:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"

jobs:
  inspect-snare-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and inspect positional snare archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/snare-metadata
          curl --fail --location --retry 3 \
            https://drumgizmo.org/kits/snare-position.zip \
            --output /tmp/snare-position.zip
          sha256sum /tmp/snare-position.zip | tee /tmp/snare-metadata/archive-sha256.txt
          unzip -q /tmp/snare-position.zip -d /tmp/snare-source
          cp /tmp/snare-source/snare-position/snare-position.xml /tmp/snare-metadata/
          cp /tmp/snare-source/snare-position/artstar-positional.xml /tmp/snare-metadata/
          find /tmp/snare-source/snare-position/samples -type f -name '*.wav' -print0 \
            | sort -z \
            | head -z -n 8 \
            | xargs -0 -I{} ffprobe -v error -show_entries \
              stream=codec_name,sample_fmt,sample_rate,channels,bits_per_raw_sample,duration \
              -of default=noprint_wrappers=0 "{}" \
            > /tmp/snare-metadata/sample-formats.txt
          find /tmp/snare-source/snare-position/samples -type f -name '*.wav' -printf '%f\n' \
            | sort > /tmp/snare-metadata/sample-files.txt

      - name: Upload snare metadata
        uses: actions/upload-artifact@v4
        with:
          name: snare-source-metadata
          path: /tmp/snare-metadata
          if-no-files-found: error
