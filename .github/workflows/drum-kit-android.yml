name: Android Drum Kit CI

on:
  push:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"
  pull_request:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"

jobs:
  inspect-snare-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect licensed Aasimonster snare layout
        run: |
          set -eu
          python -m pip install --disable-pip-version-check remotezip==0.12.3
          mkdir -p /tmp/aasimonster-layout
          python - <<'PY'
          from pathlib import Path
          from remotezip import RemoteZip

          url = 'https://drumgizmo.org/kits/Aasimonster/aasimonster2_1.zip'
          with RemoteZip(url) as archive:
              names = archive.namelist()
              xml_names = [name for name in names if name.lower().endswith('.xml')]
              snare_names = [name for name in names if 'snare' in name.lower()]
              Path('/tmp/aasimonster-layout/xml-files.txt').write_text('\n'.join(xml_names) + '\n')
              Path('/tmp/aasimonster-layout/snare-files.txt').write_text('\n'.join(snare_names) + '\n')
              for name in xml_names:
                  if 'snare' in name.lower() or name.lower().endswith('aasimonster.xml'):
                      target = Path('/tmp/aasimonster-layout') / Path(name).name
                      target.write_bytes(archive.read(name))
          PY

      - name: Upload Aasimonster metadata
        uses: actions/upload-artifact@v4
        with:
          name: aasimonster-snare-layout
          path: /tmp/aasimonster-layout
          if-no-files-found: error
