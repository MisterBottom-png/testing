name: Android Drum Kit CI

on:
  push:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"
  pull_request:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"

jobs:
  inspect-snare-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect supplemental sample sources
        run: |
          set -eu
          mkdir -p /tmp/snare-metadata
          curl --fail --location --retry 3 \
            'https://www.drumgizmo.org/wiki/doku.php?do=export_raw&id=kits:kitty' \
            > /tmp/snare-metadata/kitty-page-source.txt
          curl --fail --location --retry 3 \
            'https://api.github.com/repos/sgossner/VSCO-2-CE/git/trees/440300901dfe9275fd84e0b7763af1f8443ae62e?recursive=1' \
            > /tmp/snare-metadata/vsco-tree.json
          python - <<'PY'
          import json
          from pathlib import Path
          tree = json.loads(Path('/tmp/snare-metadata/vsco-tree.json').read_text())['tree']
          paths = [item['path'] for item in tree if item.get('type') == 'blob']
          selected = [p for p in paths if 'snare' in p.lower() and any(k in p.lower() for k in ('rim', 'cross', 'stick'))]
          Path('/tmp/snare-metadata/vsco-snare-articulations.txt').write_text('\n'.join(selected) + '\n')
          PY

      - name: Upload supplemental metadata
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-snare-metadata
          path: /tmp/snare-metadata
          if-no-files-found: error
