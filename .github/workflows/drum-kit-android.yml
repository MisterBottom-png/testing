name: Android Drum Kit CI

on:
  workflow_dispatch:
  push:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"
  pull_request:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test, build, and lint
        run: gradle --no-daemon testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drum-kit-debug-apk
          path: drum-kit-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drum-kit-lint-reports
          path: drum-kit-android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
