name: Android Drum Kit CI

on:
  push:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"
  pull_request:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
