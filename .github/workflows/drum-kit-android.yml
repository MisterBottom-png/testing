name: Android Drum Kit CI

on:
  push:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"
  pull_request:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"

jobs:
  inspect-snare-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download positional snare metadata
        run: |
          set -eu
          mkdir -p /tmp/snare-metadata
          curl --fail --location --retry 3 \
            https://drumgizmo.org/kits/snare-position.zip \
            --output /tmp/snare-position.zip
          sha256sum /tmp/snare-position.zip > /tmp/snare-metadata/archive-sha256.txt
          unzip -p /tmp/snare-position.zip snare-position/snare-position.xml \
            > /tmp/snare-metadata/snare-position.xml
          unzip -p /tmp/snare-position.zip artstar-positional.xml \
            > /tmp/snare-metadata/artstar-positional.xml
          unzip -Z1 /tmp/snare-position.zip \
            | grep '/samples/.*\.wav$' \
            > /tmp/snare-metadata/sample-files.txt

      - name: Upload snare metadata
        uses: actions/upload-artifact@v4
        with:
          name: snare-source-metadata
          path: /tmp/snare-metadata
          if-no-files-found: error
