name: Android Drum Kit CI

on:
  push:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"
  pull_request:
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snare bank tooling
        run: python -m pip install numpy==2.2.6 remotezip==0.12.3 soundfile==0.13.1

      - name: Validate snare bank tooling
        run: |
          mkdir -p build
          python -m py_compile tools/prepare_snare_bank.py tools/build_snare_bank.py

      - name: Cache downloaded acoustic samples
        uses: actions/cache@v4
        with:
          path: ~/.cache/native-drum-kit
          key: snare-sources-v1

      - name: Restore generated snare bank
        id: snare-bank-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            drum-kit-android/engine-audio/src/main/assets/snare/snare-bank.pcm
            drum-kit-android/build/snare-bank-manifest.json
          key: snare-bank-v1-${{ runner.os }}-${{ hashFiles('drum-kit-android/tools/prepare_snare_bank.py', 'drum-kit-android/tools/build_snare_bank.py') }}

      - name: Build predecoded snare PCM bank
        if: steps.snare-bank-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python tools/build_snare_bank.py \
            --output engine-audio/src/main/assets/snare/snare-bank.pcm \
            --manifest build/snare-bank-manifest.json \
            --cache-dir ~/.cache/native-drum-kit \
            2>&1 | tee build/snare-bank-build.log

      - name: Upload snare build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snare-bank-build-diagnostics
          path: drum-kit-android/build/snare-bank-build.log
          if-no-files-found: warn

      - name: Verify snare bank structure
        run: |
          python - <<'PY'
          import hashlib
          import json
          import struct
          from pathlib import Path

          bank = Path("engine-audio/src/main/assets/snare/snare-bank.pcm")
          manifest_path = Path("build/snare-bank-manifest.json")
          manifest = json.loads(manifest_path.read_text())
          raw = bank.read_bytes()
          header = struct.unpack_from("<8sIIIIII", raw)
          assert header == (b"SNAREPCM", 1, 48000, 5, 6, 4, 120), header
          assert len(manifest["samples"]) == 120
          assert manifest["bank_sha256"] == hashlib.sha256(raw).hexdigest()
          assert set(manifest["articulations"]) == {
              "center", "off_center", "edge", "rimshot", "cross_stick"
          }
          print(f"Verified {len(raw) / 1048576:.1f} MiB PCM bank with 120 samples")
          PY

      - name: Save generated snare bank
        if: steps.snare-bank-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            drum-kit-android/engine-audio/src/main/assets/snare/snare-bank.pcm
            drum-kit-android/build/snare-bank-manifest.json
          key: ${{ steps.snare-bank-cache.outputs.cache-primary-key }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test, build, and lint
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest :app:assembleDebug :app:lintDebug \
            2>&1 | tee build/gradle-validation.log

      - name: Upload Gradle validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-validation-log
          path: drum-kit-android/build/gradle-validation.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: steps.validation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-drum-kit-debug-apk
          path: drum-kit-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload snare bank manifest
        if: steps.validation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: snare-bank-manifest
          path: drum-kit-android/build/snare-bank-manifest.json
          if-no-files-found: error

      - name: Fail when validation failed
        if: steps.validation.outcome != 'success'
        run: exit 1
