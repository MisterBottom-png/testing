name: Gemini Podcast Studio baseline

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - gemini-podcast-studio/**
      - .github/workflows/gemini-podcast-baseline.yml
  pull_request:
    paths:
      - gemini-podcast-studio/**
      - .github/workflows/gemini-podcast-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gemini-podcast-studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          for file in src/js/*.js; do node --check "$file"; done

      - name: Build, verify and test
        run: npm run check
