name: Fix drum kit font scaling warning

on:
  push:
    branches:
      - agent/drum-kit-ui-redesign-phase1

permissions:
  contents: write

jobs:
  fix-warning:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/drum-kit-ui-redesign-phase1

      - name: Replace deprecated font scaling
        shell: python
        run: |
          from pathlib import Path

          source = Path(
              "drum-kit-android/engine-input/src/main/java/"
              "com/vitautas/drumkit/input/DrumSurfaceView.kt"
          )
          text = source.read_text(encoding="utf-8")

          old_import = "import android.util.AttributeSet\nimport android.util.SparseArray"
          new_import = (
              "import android.util.AttributeSet\n"
              "import android.util.SparseArray\n"
              "import android.util.TypedValue"
          )
          old_scaling = "        textSize = resources.displayMetrics.scaledDensity * 11f"
          new_scaling = """        textSize = TypedValue.applyDimension(
              TypedValue.COMPLEX_UNIT_SP,
              11f,
              resources.displayMetrics,
          )"""

          if text.count(old_import) != 1:
              raise SystemExit("Expected one Android utility import anchor")
          if text.count(old_scaling) != 1:
              raise SystemExit("Expected one deprecated scaledDensity use")

          text = text.replace(old_import, new_import).replace(old_scaling, new_scaling)
          source.write_text(text, encoding="utf-8")

      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/drum-kit-fix-font-scaling-warning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/drum-kit-fix-font-scaling-warning.yml \
            drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/DrumSurfaceView.kt
          git commit -m "Fix deprecated font scaling"
          git push origin HEAD:agent/drum-kit-ui-redesign-phase1
