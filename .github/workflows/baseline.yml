name: baseline
# Builds and tests both upstream apps on Windows (task P0-03, D7) and uploads the logs.
# How it is kept fast (Windows runners are slow mostly because of disk and virus scanning):
# - Four jobs run side by side: each app's release build (timed) and each app's test suite. One job
#   doing all four in a row ran for over three hours.
# - The build output goes to a Windows Dev Drive (ReFS, antivirus filter off) when the runner can
#   make one, else to the D: drive when there is one; Defender real-time scanning is switched off
#   and the build folders are excluded from it. The runner is thrown away after the job.
# - Crates are downloaded before the timer starts (scripts/baseline.sh), and incremental
#   compilation is off (it only slows a from-scratch build).
# - Test builds keep only line tables as debug info (much faster linking; same tests).
# - No build cache, on purpose: the release build times stay true from-scratch numbers, and one
#   app's test build would fill most of the repository's 10 GB cache.
# Runs when this file, the script or the upstream pins change (and by hand once the workflow is
# on the repository's default branch).
concurrency:
  group: baseline-split-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - .github/workflows/baseline.yml
      - scripts/baseline.sh
      - upstream.lock
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  baseline:
    name: ${{ matrix.app }} ${{ matrix.part }}
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        app: [photocraft, vectorcraft]
        part: [build, test]
    steps:
      - uses: actions/checkout@v4
      - name: Fast build drive, no virus scanning
        shell: pwsh
        run: |
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystem, @{n='FreeGB'; e={[math]::Round($_.SizeRemaining / 1GB)}}, @{n='SizeGB'; e={[math]::Round($_.Size / 1GB)}}
          "workspace: $env:GITHUB_WORKSPACE"
          $drive = $null
          try {
            # Same approach as uv's CI (astral-sh/uv .github/workflows/setup-dev-drive.ps1). The
            # VHDX is dynamic: it takes only the space the build writes.
            $vhd = 'C:\astudio_dev_drive.vhdx'
            $volume = New-VHD -Path $vhd -SizeBytes 60GB -Dynamic | Mount-VHD -Passthru | Initialize-Disk -Passthru |
              New-Partition -AssignDriveLetter -UseMaximumSize | Format-Volume -DevDrive -Confirm:$false -Force
            $drive = "$($volume.DriveLetter):"
            fsutil devdrv trust $drive
            if ($LASTEXITCODE) { throw "fsutil devdrv trust failed ($LASTEXITCODE)" }
            fsutil devdrv enable /disallowAv
            if ($LASTEXITCODE) { throw "fsutil devdrv enable failed ($LASTEXITCODE)" }
            Dismount-VHD -Path $vhd
            Mount-VHD -Path $vhd
            fsutil devdrv query $drive
            "build drive: Dev Drive $drive"
          } catch {
            "no Dev Drive on this runner: $_"
            $drive = if (Test-Path 'D:\') { 'D:' } else { 'C:' }
            "build drive: $drive"
          }
          $target = "$drive\cargo-target"
          $tmp = "$drive\tmp"
          New-Item -ItemType Directory -Force -Path $target, $tmp | Out-Null
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { "could not switch off real-time scanning: $_" }
          foreach ($p in @($target, $tmp, $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")) {
            try { Add-MpPreference -ExclusionPath $p } catch { "could not exclude ${p}: $_" }
          }
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
          "TMP=$tmp" >> $env:GITHUB_ENV
          "TEMP=$tmp" >> $env:GITHUB_ENV
          # A failed fsutil call above must not fail the step (the fallback drive works).
          $global:LASTEXITCODE = 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Machine
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH, $(nproc) CPUs"
          echo "RAM GB: $(powershell -Command "[math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)" | tr -d '\r')"
          rustc --version
      - name: Clone upstream at the pinned commits
        shell: bash
        run: scripts/bootstrap.sh
      # Note: photocraft is built without its optional `heif` feature (upstream release builds use it).
      # The release build uses upstream's profile unchanged.
      - name: Run scripts/baseline.sh ${{ matrix.app }} ${{ matrix.part }}
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: scripts/baseline.sh ${{ matrix.app }} ${{ matrix.part }} 2>&1 | tee baseline-windows-${{ matrix.app }}-${{ matrix.part }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-windows-${{ matrix.app }}-${{ matrix.part }}
          path: |
            baseline-windows-*.log
            target/baseline/test-*.log
          if-no-files-found: ignore
