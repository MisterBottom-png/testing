name: Gemini current source snapshot

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - .github/workflows/gemini-current-source-snapshot.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-current-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-current-source
          path: gemini-podcast-studio
          include-hidden-files: true
          if-no-files-found: error
