name: Drum Kit Android Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android-validation.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android-validation.yml"

concurrency:
  group: drum-kit-android-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: drum-kit-android

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install compile SDK
        shell: bash
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-cleanup: on-success

      - name: Apply deterministic velocity repair
        run: python ../.github/scripts/apply-drum-kit-bugfix-task1.py

      - name: Run Android unit tests and compile app
        run: >-
          gradle --no-daemon --console=plain --warning-mode=fail
          :engine-input:testDebugUnitTest
          :engine-audio:testDebugUnitTest
          :feature-kit:testDebugUnitTest
          :app:compileDebugKotlin

      - name: Commit verified repair
        working-directory: .
        run: |
          git checkout origin/main -- .github/workflows/drum-kit-android-validation.yml
          rm -f .github/workflows/drum-kit-bugfix-task1.yml
          rm -f .github/scripts/apply-drum-kit-bugfix-task1.py
          git config user.name "chatgpt-bugfix-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make drum strike velocity deterministic"
          git push origin HEAD:agent/drum-kit-current-bug-fixes
