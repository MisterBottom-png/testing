name: Drum Kit Android Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android-validation.yml"
  push:
    branches:
      - main
    paths:
      - "drum-kit-android/**"
      - ".github/workflows/drum-kit-android-validation.yml"

concurrency:
  group: drum-kit-android-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/drum-kit-current-bug-fixes
          fetch-depth: 0

      - name: Apply deterministic velocity repair
        run: python .github/scripts/repair-drum-kit-bugfix-task1-runner.py

      - name: Commit source repair
        run: |
          git config user.name "chatgpt-bugfix-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drum-kit-android/core-model/src/main/java/com/vitautas/drumkit/model/KitModels.kt
          git add drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/DrumSurfaceView.kt
          git add drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/StrikeVelocityEstimator.kt
          git add drum-kit-android/engine-input/src/test/java/com/vitautas/drumkit/input/StrikeVelocityEstimatorTest.kt
          git commit -m "fix: make drum strike velocity deterministic"
          git push origin HEAD:agent/drum-kit-current-bug-fixes
