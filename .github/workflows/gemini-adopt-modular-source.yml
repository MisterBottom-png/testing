name: Adopt Gemini modular source

on:
  push:
    branches:
      - agent/gemini-podcast-modular-source
    paths:
      - .github/workflows/gemini-adopt-modular-source.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-adopt-modular-source.yml

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-podcast-modular-source
          fetch-depth: 0
      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin agent/gemini-podcast-modular-staging
          git checkout origin/agent/gemini-podcast-modular-staging -- .github/tmp
          cat .github/tmp/gemini-modular-source.part-* > /tmp/gemini-modular-source.tar.gz.b64
          base64 --decode /tmp/gemini-modular-source.tar.gz.b64 > /tmp/gemini-modular-source.tar.gz
          echo "8ed8f95df5fb6738230d1635bc98af7150e7c26f722ee37dc611ee7dab7027b4  /tmp/gemini-modular-source.tar.gz" | sha256sum --check
          tar -tzf /tmp/gemini-modular-source.tar.gz > /dev/null
      - name: Apply modular source
        shell: bash
        run: |
          set -euxo pipefail
          tar -xzf /tmp/gemini-modular-source.tar.gz -C .
          rm -f gemini-podcast-studio/src/js/audio.js
          rm -f nonexistent
          rm -f .github/scripts/analyse-gemini-modules.mjs
          rm -f .github/workflows/gemini-module-analysis.yml
          rm -f .github/workflows/gemini-module-tooling.yml
          rm -f .github/workflows/gemini-apply-modular-source.yml
          rm -f .github/workflows/gemini-adopt-modular-source.yml
          rm -rf .github/tmp
      - name: Verify modular source
        working-directory: gemini-podcast-studio
        run: |
          npm install --no-audit --no-fund
          for file in src/js/*.js; do node --check "$file"; done
          npm run check
      - name: Commit modular extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract explicit ES modules"
          git push origin HEAD:agent/gemini-podcast-modular-source
          git push origin --delete agent/gemini-podcast-modular-staging || true
