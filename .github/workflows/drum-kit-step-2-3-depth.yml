name: Apply drum kit Step 2.3 depth relationships

on:
  push:
    branches:
      - agent/drum-kit-ui-redesign-phase1

permissions:
  contents: write

jobs:
  apply-depth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/drum-kit-ui-redesign-phase1

      - name: Apply depth model, renderer passes, tests, and documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"Expected {expected} occurrence(s), found {count}: {old[:120]!r}"
                  )
              return text.replace(old, new)

          camera_path = Path(
              "drum-kit-android/core-model/src/main/java/"
              "com/vitautas/drumkit/model/KitCamera.kt"
          )
          camera = camera_path.read_text(encoding="utf-8")
          camera = replace_exact(
              camera,
              "    const val HORIZON_Y = 0.68f\n"
              "    const val REFERENCE_VIEWPORT_ASPECT_RATIO = 1536f / 707f",
              "    const val HORIZON_Y = 0.68f\n"
              "    const val FLOOR_PLANE_Y = 0.94f\n"
              "    const val REFERENCE_VIEWPORT_ASPECT_RATIO = 1536f / 707f",
          )
          camera_path.write_text(camera, encoding="utf-8")

          models_path = Path(
              "drum-kit-android/core-model/src/main/java/"
              "com/vitautas/drumkit/model/KitModels.kt"
          )
          models = models_path.read_text(encoding="utf-8")
          models = replace_exact(
              models,
              "enum class InstrumentRendererKey {\n"
              "    DRUM,\n"
              "    SNARE,\n"
              "    KICK,\n"
              "    CYMBAL,\n"
              "    HI_HAT,\n"
              "}\n",
              "enum class InstrumentRendererKey {\n"
              "    DRUM,\n"
              "    SNARE,\n"
              "    KICK,\n"
              "    CYMBAL,\n"
              "    HI_HAT,\n"
              "}\n\n"
              "object StudioKitDepth {\n"
              "    const val BACK_CYMBAL = 10\n"
              "    const val KICK = 20\n"
              "    const val RACK_TOM = 30\n"
              "    const val FLOOR_TOM = 40\n"
              "    const val HI_HAT = 45\n"
              "    const val SNARE = 50\n"
              "}\n",
          )
          models = replace_exact(
              models,
              "    val labelPosition: NormalizedPoint,\n"
              "    val rendererKey: InstrumentRendererKey,\n"
              ") {\n"
              "    init {\n"
              "        require(rotationDegrees.isFinite()) { \"rotation must be finite\" }\n"
              "    }\n"
              "}",
              "    val labelPosition: NormalizedPoint,\n"
              "    val rendererKey: InstrumentRendererKey,\n"
              "    val supportFloorY: Float? = null,\n"
              ") {\n"
              "    init {\n"
              "        require(rotationDegrees.isFinite()) { \"rotation must be finite\" }\n"
              "        require(supportFloorY == null || supportFloorY.isFinite() && supportFloorY in 0f..1f) {\n"
              "            \"support floor must be normalized and finite\"\n"
              "        }\n"
              "    }\n"
              "}",
          )
          models = replace_exact(
              models,
              "            renderZIndex = 10,",
              "            renderZIndex = StudioKitDepth.BACK_CYMBAL,",
              expected=2,
          )
          models = replace_exact(
              models,
              "            renderZIndex = 45,",
              "            renderZIndex = StudioKitDepth.HI_HAT,",
          )
          models = replace_exact(
              models,
              "            renderZIndex = 30,",
              "            renderZIndex = StudioKitDepth.RACK_TOM,",
              expected=2,
          )
          models = replace_exact(
              models,
              "            renderZIndex = 35,",
              "            renderZIndex = StudioKitDepth.KICK,",
          )
          models = replace_exact(
              models,
              "            renderZIndex = 40,",
              "            renderZIndex = StudioKitDepth.FLOOR_TOM,",
          )
          models = replace_exact(
              models,
              "            renderZIndex = 50,",
              "            renderZIndex = StudioKitDepth.SNARE,",
          )
          models = replace_exact(
              models,
              "            labelPosition = labelPosition,\n"
              "            rendererKey = rendererKey,\n"
              "        ),",
              "            labelPosition = labelPosition,\n"
              "            rendererKey = rendererKey,\n"
              "            supportFloorY = when (id) {\n"
              "                InstrumentId.TOM_HIGH,\n"
              "                InstrumentId.TOM_MID,\n"
              "                -> null\n\n"
              "                else -> StudioKitCamera.FLOOR_PLANE_Y\n"
              "            },\n"
              "        ),",
          )
          models_path.write_text(models, encoding="utf-8")

          view_path = Path(
              "drum-kit-android/engine-input/src/main/java/"
              "com/vitautas/drumkit/input/DrumSurfaceView.kt"
          )
          view = view_path.read_text(encoding="utf-8")
          view = replace_exact(
              view,
              "import com.vitautas.drumkit.model.InstrumentRendererKey\n"
              "import com.vitautas.drumkit.model.StudioKitDefinition",
              "import com.vitautas.drumkit.model.InstrumentRendererKey\n"
              "import com.vitautas.drumkit.model.StudioKitCamera\n"
              "import com.vitautas.drumkit.model.StudioKitDefinition",
          )
          view = replace_exact(
              view,
              "    private val renderStates = ArrayList<InstrumentRenderState>(StudioKitDefinition.instruments.size)\n"
              "    private val animationStates = Array(InstrumentId.entries.size) { InstrumentAnimationState() }",
              "    private val renderStates = ArrayList<InstrumentRenderState>(StudioKitDefinition.instruments.size)\n"
              "    private val animationStates = Array(InstrumentId.entries.size) { InstrumentAnimationState() }\n"
              "    private val kickDefinition = StudioKitDefinition.instruments.first { it.id == InstrumentId.KICK }\n"
              "    private var rackMountX = 0f\n"
              "    private var rackMountY = 0f",
          )
          view = replace_exact(
              view,
              "        spotlightRect.set(-width * 0.10f, -height * 0.25f, width * 1.10f, height * 0.95f)\n\n"
              "        renderStates.clear()",
              "        spotlightRect.set(-width * 0.10f, -height * 0.25f, width * 1.10f, height * 0.95f)\n\n"
              "        val kickBounds = kickDefinition.layout.drawBounds\n"
              "        rackMountX = kickBounds.centerX * width.toFloat()\n"
              "        rackMountY = (kickBounds.top + kickBounds.height * 0.14f) * height.toFloat()\n\n"
              "        renderStates.clear()",
          )
          view = replace_exact(
              view,
              "        val nowNanos = System.nanoTime()\n"
              "        var animationActive = false\n"
              "        for (renderState in renderStates) {\n"
              "            val animationState = animationStates[renderState.definition.id.ordinal]\n"
              "            if (updateAnimation(renderState.definition, animationState, nowNanos)) {\n"
              "                animationActive = true\n"
              "            }\n"
              "            drawInstrument(canvas, renderState, animationState)\n"
              "        }",
              "        val nowNanos = System.nanoTime()\n"
              "        var animationActive = false\n"
              "        for (renderState in renderStates) {\n"
              "            val animationState = animationStates[renderState.definition.id.ordinal]\n"
              "            if (updateAnimation(renderState.definition, animationState, nowNanos)) {\n"
              "                animationActive = true\n"
              "            }\n"
              "        }\n\n"
              "        for (renderState in renderStates) {\n"
              "            drawInstrumentShadow(canvas, renderState)\n"
              "        }\n"
              "        for (renderState in renderStates) {\n"
              "            drawInstrumentSupport(canvas, renderState)\n"
              "        }\n"
              "        for (renderState in renderStates) {\n"
              "            val animationState = animationStates[renderState.definition.id.ordinal]\n"
              "            drawInstrumentSurface(canvas, renderState, animationState)\n"
              "        }",
          )
          old_instrument_function = """    private fun drawInstrument(
              canvas: Canvas,
              state: InstrumentRenderState,
              animation: InstrumentAnimationState,
          ) {
              val saveCount = canvas.save()
              val bounds = state.drawBounds
              canvas.rotate(
                  state.definition.layout.rotationDegrees,
                  bounds.centerX(),
                  bounds.centerY(),
              )

              canvas.drawOval(state.shadowRect, shadowPaint)
              when (state.definition.layout.rendererKey) {
                  InstrumentRendererKey.CYMBAL -> drawCymbal(canvas, state, animation, hiHat = false)
                  InstrumentRendererKey.HI_HAT -> drawCymbal(canvas, state, animation, hiHat = true)
                  InstrumentRendererKey.DRUM -> drawDrum(canvas, state, animation, snare = false)
                  InstrumentRendererKey.SNARE -> drawDrum(canvas, state, animation, snare = true)
                  InstrumentRendererKey.KICK -> drawKick(canvas, state, animation)
              }
              canvas.restoreToCount(saveCount)
          }
"""
          new_instrument_functions = """    private fun drawInstrumentShadow(canvas: Canvas, state: InstrumentRenderState) {
              val saveCount = canvas.save()
              val bounds = state.drawBounds
              canvas.rotate(
                  state.definition.layout.rotationDegrees,
                  bounds.centerX(),
                  bounds.centerY(),
              )
              canvas.drawOval(state.shadowRect, shadowPaint)
              canvas.restoreToCount(saveCount)
          }

          private fun drawInstrumentSupport(canvas: Canvas, state: InstrumentRenderState) {
              when (state.definition.id) {
                  InstrumentId.CRASH,
                  InstrumentId.RIDE,
                  InstrumentId.HI_HAT,
                  -> drawCymbalStand(canvas, state)

                  InstrumentId.TOM_HIGH,
                  InstrumentId.TOM_MID,
                  -> drawRackTomMount(canvas, state)

                  InstrumentId.KICK -> drawKickLegs(canvas, state)
                  InstrumentId.FLOOR_TOM -> drawFloorTomLegs(canvas, state)
                  InstrumentId.SNARE -> drawSnareStand(canvas, state)
              }
          }

          private fun drawCymbalStand(canvas: Canvas, state: InstrumentRenderState) {
              val floorY = state.definition.layout.supportFloorY?.times(height.toFloat()) ?: return
              val disc = state.primaryRect
              val bounds = state.drawBounds
              val centerX = disc.centerX()
              val jointY = floorY - maxOf(bounds.height() * 0.08f, density * 10f)
              val footSpread = bounds.width() * 0.18f

              canvas.drawLine(centerX, disc.centerY(), centerX, jointY, standPaint)
              canvas.drawLine(centerX, jointY, centerX - footSpread, floorY, standPaint)
              canvas.drawLine(centerX, jointY, centerX + footSpread, floorY, standPaint)
          }

          private fun drawRackTomMount(canvas: Canvas, state: InstrumentRenderState) {
              val shell = state.primaryRect
              val startX = if (state.definition.id == InstrumentId.TOM_HIGH) {
                  shell.right - shell.width() * 0.22f
              } else {
                  shell.left + shell.width() * 0.22f
              }
              val startY = shell.bottom - shell.height() * 0.08f

              canvas.drawLine(startX, startY, rackMountX, rackMountY, hardwarePaint)
              canvas.drawCircle(rackMountX, rackMountY, density * 3f, hardwarePaint)
          }

          private fun drawKickLegs(canvas: Canvas, state: InstrumentRenderState) {
              val floorY = state.definition.layout.supportFloorY?.times(height.toFloat()) ?: return
              val shell = state.primaryRect
              val bounds = state.drawBounds

              canvas.drawLine(
                  shell.left + shell.width() * 0.18f,
                  shell.bottom - shell.height() * 0.08f,
                  bounds.left - bounds.width() * 0.02f,
                  floorY,
                  standPaint,
              )
              canvas.drawLine(
                  shell.right - shell.width() * 0.18f,
                  shell.bottom - shell.height() * 0.08f,
                  bounds.right + bounds.width() * 0.02f,
                  floorY,
                  standPaint,
              )
          }

          private fun drawFloorTomLegs(canvas: Canvas, state: InstrumentRenderState) {
              val floorY = state.definition.layout.supportFloorY?.times(height.toFloat()) ?: return
              val shell = state.primaryRect
              val bounds = state.drawBounds

              canvas.drawLine(
                  shell.left + shell.width() * 0.16f,
                  shell.bottom - shell.height() * 0.12f,
                  bounds.left + bounds.width() * 0.04f,
                  floorY,
                  standPaint,
              )
              canvas.drawLine(
                  shell.right - shell.width() * 0.16f,
                  shell.bottom - shell.height() * 0.12f,
                  bounds.right - bounds.width() * 0.04f,
                  floorY,
                  standPaint,
              )
          }

          private fun drawSnareStand(canvas: Canvas, state: InstrumentRenderState) {
              val floorY = state.definition.layout.supportFloorY?.times(height.toFloat()) ?: return
              val shell = state.primaryRect
              val bounds = state.drawBounds
              val centerX = shell.centerX()
              val stemTopY = shell.bottom - shell.height() * 0.08f
              val jointY = floorY - (floorY - shell.bottom) * 0.28f
              val footSpread = bounds.width() * 0.18f

              canvas.drawLine(centerX, stemTopY, centerX, jointY, standPaint)
              canvas.drawLine(centerX, jointY, centerX - footSpread, floorY, standPaint)
              canvas.drawLine(centerX, jointY, centerX + footSpread, floorY, standPaint)
          }

          private fun drawInstrumentSurface(
              canvas: Canvas,
              state: InstrumentRenderState,
              animation: InstrumentAnimationState,
          ) {
              val saveCount = canvas.save()
              val bounds = state.drawBounds
              canvas.rotate(
                  state.definition.layout.rotationDegrees,
                  bounds.centerX(),
                  bounds.centerY(),
              )

              when (state.definition.layout.rendererKey) {
                  InstrumentRendererKey.CYMBAL -> drawCymbal(canvas, state, animation, hiHat = false)
                  InstrumentRendererKey.HI_HAT -> drawCymbal(canvas, state, animation, hiHat = true)
                  InstrumentRendererKey.DRUM -> drawDrum(canvas, state, animation, snare = false)
                  InstrumentRendererKey.SNARE -> drawDrum(canvas, state, animation, snare = true)
                  InstrumentRendererKey.KICK -> drawKick(canvas, state, animation)
              }
              canvas.restoreToCount(saveCount)
          }
"""
          view = replace_exact(view, old_instrument_function, new_instrument_functions)
          view = replace_exact(
              view,
              "        val shell = state.primaryRect\n"
              "        val head = state.secondaryRect\n"
              "        val bounds = state.drawBounds\n\n"
              "        canvas.drawLine(shell.left + shell.width() * 0.18f, shell.bottom, bounds.left + bounds.width() * 0.08f, bounds.bottom, standPaint)\n"
              "        canvas.drawLine(shell.right - shell.width() * 0.18f, shell.bottom, bounds.right - bounds.width() * 0.08f, bounds.bottom, standPaint)\n\n"
              "        shellPaint.shader = state.primaryShader",
              "        val shell = state.primaryRect\n"
              "        val head = state.secondaryRect\n\n"
              "        shellPaint.shader = state.primaryShader",
          )
          view = replace_exact(
              view,
              "        val shell = state.primaryRect\n"
              "        val head = state.secondaryRect\n"
              "        val bounds = state.drawBounds\n\n"
              "        canvas.drawLine(shell.left + shell.width() * 0.18f, shell.bottom, bounds.left, bounds.bottom, standPaint)\n"
              "        canvas.drawLine(shell.right - shell.width() * 0.18f, shell.bottom, bounds.right, bounds.bottom, standPaint)\n\n"
              "        shellPaint.shader = state.primaryShader",
              "        val shell = state.primaryRect\n"
              "        val head = state.secondaryRect\n\n"
              "        shellPaint.shader = state.primaryShader",
          )
          view = replace_exact(
              view,
              "        canvas.drawLine(centerX, centerY, centerX, bounds.bottom, standPaint)\n"
              "        canvas.drawLine(centerX, bounds.bottom - bounds.height() * 0.05f, bounds.left + bounds.width() * 0.28f, bounds.bottom, standPaint)\n"
              "        canvas.drawLine(centerX, bounds.bottom - bounds.height() * 0.05f, bounds.right - bounds.width() * 0.28f, bounds.bottom, standPaint)\n\n"
              "        cymbalPaint.shader = state.primaryShader",
              "        cymbalPaint.shader = state.primaryShader",
          )
          view_path.write_text(view, encoding="utf-8")

          tests_path = Path(
              "drum-kit-android/core-model/src/test/java/"
              "com/vitautas/drumkit/model/HitRegionTest.kt"
          )
          tests = tests_path.read_text(encoding="utf-8")
          test_anchor = """    @Test
          fun snareUsesEntireRenderedHeadInsteadOfDetachedInset() {
"""
          depth_tests = """    @Test
          fun renderDepthMatchesElevatedDrummerView() {
              val renderOrder = StudioKitDefinition.renderOrder.map { it.id }

              assertTrue(renderOrder.indexOf(InstrumentId.CRASH) < renderOrder.indexOf(InstrumentId.KICK))
              assertTrue(renderOrder.indexOf(InstrumentId.RIDE) < renderOrder.indexOf(InstrumentId.KICK))
              assertTrue(renderOrder.indexOf(InstrumentId.KICK) < renderOrder.indexOf(InstrumentId.TOM_HIGH))
              assertTrue(renderOrder.indexOf(InstrumentId.KICK) < renderOrder.indexOf(InstrumentId.TOM_MID))
              assertTrue(renderOrder.indexOf(InstrumentId.TOM_HIGH) < renderOrder.indexOf(InstrumentId.SNARE))
              assertTrue(renderOrder.indexOf(InstrumentId.TOM_MID) < renderOrder.indexOf(InstrumentId.SNARE))
              assertTrue(renderOrder.indexOf(InstrumentId.KICK) < renderOrder.indexOf(InstrumentId.FLOOR_TOM))
              assertTrue(renderOrder.indexOf(InstrumentId.KICK) < renderOrder.indexOf(InstrumentId.SNARE))
          }

          @Test
          fun floorSupportedHardwareUsesOneSharedPlane() {
              val floorSupported = listOf(
                  InstrumentId.CRASH,
                  InstrumentId.RIDE,
                  InstrumentId.HI_HAT,
                  InstrumentId.KICK,
                  InstrumentId.FLOOR_TOM,
                  InstrumentId.SNARE,
              )

              for (instrument in floorSupported) {
                  assertEquals(
                      StudioKitCamera.FLOOR_PLANE_Y,
                      definition(instrument).layout.supportFloorY ?: Float.NaN,
                      0.00001f,
                  )
              }
              assertNull(definition(InstrumentId.TOM_HIGH).layout.supportFloorY)
              assertNull(definition(InstrumentId.TOM_MID).layout.supportFloorY)
              assertTrue(StudioKitCamera.FLOOR_PLANE_Y > StudioKitCamera.HORIZON_Y)
              assertEquals(
                  definition(InstrumentId.KICK).layout.drawBounds.bottom,
                  StudioKitCamera.FLOOR_PLANE_Y,
                  0.00001f,
              )
          }

"""
          tests = replace_exact(tests, test_anchor, depth_tests + test_anchor)
          tests_path.write_text(tests, encoding="utf-8")

          docs_path = Path("drum-kit-android/docs/source-mapping.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = replace_exact(
              docs,
              "- Existing render order and hit-test priority remain unchanged pending the dedicated depth and occlusion steps.\n\n"
              "## Prototype behavior represented in the base",
              "- Hit-test priority remains unchanged; Step 2.3 subsequently revises visual depth independently.\n\n"
              "## Depth relationships and shared floor plane\n\n"
              "Phase 2 Step 2.3 separates the renderer into background-shadow, support-hardware, and playable-surface passes:\n\n"
              "- Crash and ride remain the farthest visual surfaces.\n"
              "- The kick renders behind the rack toms, floor tom, hi-hat, and snare.\n"
              "- Rack toms render behind the player-side snare while remaining in front of the kick.\n"
              "- Cymbal and hi-hat stands render before every drum surface, so hardware stays visually behind shells.\n"
              "- Rack-tom mount stems render behind both the kick and rack-tom surfaces.\n"
              "- Kick legs, floor-tom legs, the snare stand, and cymbal stands terminate at the shared normalized floor plane `StudioKitCamera.FLOOR_PLANE_Y = 0.94`.\n"
              "- Instrument rotation applies to playable surfaces and shadows, not to floor anchors, so stand feet remain grounded.\n"
              "- Exact segment clipping and hidden-hardware masks remain reserved for Step 2.4.\n\n"
              "## Prototype behavior represented in the base",
          )
          docs = replace_exact(
              docs,
              "- Camera-aligned instrument positions, scale relationships, and control-safe placement\n"
              "- CI unit tests, Android build, lint, and downloadable debug APK artifact",
              "- Camera-aligned instrument positions, scale relationships, and control-safe placement\n"
              "- Explicit drummer-view surface depth, background support hardware, and one shared floor plane\n"
              "- CI unit tests, Android build, lint, and downloadable debug APK artifact",
          )
          docs = replace_exact(
              docs,
              "- Correct depth relationships and establish one shared floor plane\n"
              "- Correct hardware occlusion and clipping",
              "- Correct hardware occlusion and clipping",
          )
          docs = replace_exact(
              docs,
              "the fixed camera contract, the camera-aligned Phase 2 kit placement, shared viewport-aware input geometry, and lifecycle-hardened audio operation.",
              "the fixed camera contract, the camera-aligned Phase 2 kit placement, explicit Step 2.3 depth relationships, a shared floor plane, shared viewport-aware input geometry, and lifecycle-hardened audio operation.",
          )
          docs_path.write_text(docs, encoding="utf-8")

      - name: Commit Step 2.3 and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/drum-kit-step-2-3-depth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/drum-kit-step-2-3-depth.yml \
            drum-kit-android/core-model/src/main/java/com/vitautas/drumkit/model/KitCamera.kt \
            drum-kit-android/core-model/src/main/java/com/vitautas/drumkit/model/KitModels.kt \
            drum-kit-android/core-model/src/test/java/com/vitautas/drumkit/model/HitRegionTest.kt \
            drum-kit-android/engine-input/src/main/java/com/vitautas/drumkit/input/DrumSurfaceView.kt \
            drum-kit-android/docs/source-mapping.md
          git commit -m "Implement Step 2.3 depth relationships"
          git push origin HEAD:agent/drum-kit-ui-redesign-phase1
