name: Materialize Podcast Studio

on:
  push:
    branches:
      - agent/gemini-podcast-studio
    paths:
      - .github/workflows/materialize-podcast-studio.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify application
        shell: bash
        run: |
          set -euo pipefail
          cat .podcast-transfer/part-* > /tmp/podcast-studio.b64
          base64 --decode /tmp/podcast-studio.b64 | gzip --decompress > podcast-studio.html
          echo "429d8651adef2472330a54fe2782acd33fc3c17561e9bddc63cebaff7ce896c7  podcast-studio.html" | sha256sum --check --strict

      - name: Commit finished application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .podcast-transfer
          rm -f .github/workflows/materialize-podcast-studio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Add Gemini Podcast Studio"
          git push
