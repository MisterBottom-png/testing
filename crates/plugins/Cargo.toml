[package]
name = "astudio-plugins"
description = "A-Studio: Sandboxed WebAssembly plug-ins (wasmi): pixel filters, object filters and live effects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
astudio-geom = { path = "../geom" }
astudio-color = { path = "../color" }
astudio-vdoc = { path = "../vdoc" }
astudio-raster = { path = "../raster" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasmi = { workspace = true }

# Pixel filters run their bands in parallel on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
wat = "1.228"

[lints]
workspace = true
