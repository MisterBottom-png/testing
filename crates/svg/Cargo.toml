[package]
name = "astudio-svg"
description = "A-Studio: SVG import and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
astudio-geom = { path = "../geom" }
astudio-color = { path = "../color" }
astudio-vdoc = { path = "../vdoc" }
astudio-effects = { path = "../effects" }
astudio-vbrush = { path = "../vbrush" }
astudio-text = { path = "../text" }
kurbo = { workspace = true }
usvg = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Live effect params read from filters.
serde_json = { workspace = true }
# SVGZ (gzip, pure-Rust backend: builds for wasm).
flate2 = { workspace = true }
image = { workspace = true }
# Colour / transform / length parsing for the <text> fallback (MIT OR Apache-2.0; already used by usvg).
svgtypes = "0.16"

[dev-dependencies]
# Reading embedded font subsets back.
skrifa = { workspace = true }
# A variable font built in code (no font file is committed).
astudio-text = { path = "../text", features = ["test-fonts"] }
resvg = { version = "0.48", default-features = false }
astudio-testkit = { path = "../testkit" }
proptest = { workspace = true }
image = { workspace = true }

[lints]
workspace = true
