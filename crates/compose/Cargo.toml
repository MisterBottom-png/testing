[package]
name = "astudio-compose"
description = "A-Studio: CPU compositor, the reference oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
astudio-geom = { path = "../geom" }
astudio-color = { path = "../color" }
astudio-raster = { path = "../raster" }
astudio-doc = { path = "../doc" }
astudio-vector = { path = "../vector" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
astudio-paint = { path = "../paint" }

[[bench]]
name = "compose"
harness = false

[lints]
workspace = true
