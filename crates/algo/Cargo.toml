[package]
name = "astudio-algo"
description = "A-Studio: Pixel algorithms: filters, adjustments, selections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
astudio-geom = { path = "../geom" }
astudio-color = { path = "../color" }
astudio-raster = { path = "../raster" }
serde = { workspace = true }

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
