[package]
name = "astudio-psd"
description = "A-Studio: PSD/PSB parser and writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Real-file corpus tests (opt-in). Fail when the corpus is missing.
corpus = []
default = []
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
astudio-psd = { path = ".", features = ["testgen"] }

[lints]
workspace = true
