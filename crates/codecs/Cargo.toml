[package]
name = "astudio-codecs"
description = "A-Studio: Image codecs (PNG, JPEG, TIFF, WebP, EXR, GIF, BMP, TGA, ICO, QOI, HDR; HEIF with the heif feature)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Real-file corpus tests (opt-in). Fail when the corpus is missing.
corpus = []
default = []
# AVIF *encode* via ravif (pure Rust). Decoding AVIF needs dav1d (C), so AVIF
# stays read-unsupported and therefore asymmetric; it is off by default.
avif = ["image/avif"]
# HEIC/HEIF decode via the optional astudio-heif crate (heic-rs, pure Rust). Without it HEIF files
# are still recognised and opening one is a clear "unsupported" error.
heif = ["dep:astudio-heif"]

[dependencies]
thiserror.workspace = true
image = { workspace = true, features = ["gif", "bmp", "tga", "ico", "qoi", "hdr"] }
png = "0.18"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
exr = { version = "1.73", default-features = false }
half = "2"
flate2.workspace = true
image-webp = "0.2"
zune-jpeg.workspace = true
zune-core = "0.5"
jpeg-encoder.workspace = true
astudio-heif = { path = "../heif", optional = true }

# Orientation is applied a band of rows per task on native; wasm stays single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[dev-dependencies]
proptest.workspace = true
# Oracle decoders for cross-checking in tests only.
image = { workspace = true, features = ["png", "jpeg", "tiff"] }

[lints]
workspace = true
