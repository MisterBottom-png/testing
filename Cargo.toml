[workspace]
exclude = ["crates/format/fuzz", "crates/codecs/fuzz", "crates/raw/fuzz", "crates/psd/fuzz", "crates/plugins/example", "crates/svg/fuzz", "crates/pdf/fuzz", "crates/eps/fuzz", "crates/cad/fuzz", "crates/metafile/fuzz"]
resolver = "3"
members = [
    "crates/geom",
    "crates/color",
    "crates/raster",
    "crates/heif",
    "crates/raw",
    "crates/psd",
    "crates/codecs",
    "crates/tablet",
    "crates/vdoc",
    "crates/doc",
    "crates/text",
    "crates/pathops",
    "crates/vbrush",
    "crates/effects",
    "crates/paint",
    "crates/ops",
    "crates/vector",
    "crates/algo",
    "crates/trace",
    "crates/compose",
    "crates/gpu",
    "crates/render",
    "crates/format",
    "crates/svg",
    "crates/pdf",
    "crates/eps",
    "crates/cad",
    "crates/metafile",
    "crates/io",
    "crates/tools",
    "crates/plugins",
    "crates/engine",
    "crates/ui",
    "crates/automation",
    "crates/testkit",
    "apps/a-studio",
    "apps/a-studio-cli",
    "apps/a-studio-web",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<github-user>/a-studio"

# External dependencies are added here as crates are ported (docs/03-dependencies.md lists every
# crate and version both upstream workspaces use, and the version to pick where they differ).
[workspace.dependencies]
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
proptest = "1"
log = "0.4"
rayon = "1"
# Benchmarks only (astudio-compose, P2-20), as in PhotoCraft.
criterion = { version = "0.5", default-features = false }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
linesweeper = "0.4"
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
moxcms = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
tiff = "0.11"
zune-jpeg = "0.5"
# P2-03: one version of each crate the two upstream apps pinned differently (docs/03-dependencies.md
# "Version conflicts"). Ported crates take these; a second version only with a reason in deny.toml.
base64 = "0.22"
harfrust = "0.13"
skrifa = "0.47"
svgtypes = "0.16"
usvg = "0.48"
krilla = "0.8"
vello_common = { version = "0.2", default-features = false }
vello_cpu = "0.2"
muda = { version = "=0.21.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"


# Plug-ins run in the wasmi interpreter, whose fuel and time budgets are tested (astudio-plugins
# tests/abi.rs): unoptimised, it is too slow to stop runaway plug-ins in time. VectorCraft builds
# every dependency at opt-level 2 in dev; A-Studio does it for the interpreter only (P2-14).
[profile.dev.package.wasmi]
opt-level = 2

[profile.dev.package.wasmi_collections]
opt-level = 2

[profile.dev.package.wasmi_core]
opt-level = 2

[profile.dev.package.wasmi_ir]
opt-level = 2

[profile.dev.package.wasmparser]
opt-level = 2

[profile.release]
panic = "unwind"
