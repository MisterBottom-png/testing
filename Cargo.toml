[workspace]
resolver = "3"
members = [
    "crates/geom",
    "crates/color",
    "crates/raster",
    "crates/psd",
    "crates/codecs",
    "crates/tablet",
    "crates/vdoc",
    "crates/doc",
    "crates/text",
    "crates/pathops",
    "crates/effects",
    "crates/paint",
    "crates/algo",
    "crates/trace",
    "crates/compose",
    "crates/gpu",
    "crates/render",
    "crates/format",
    "crates/svg",
    "crates/pdf",
    "crates/io",
    "crates/tools",
    "crates/plugins",
    "crates/engine",
    "crates/ui",
    "crates/automation",
    "crates/testkit",
    "apps/a-studio",
    "apps/a-studio-cli",
    "apps/a-studio-web",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<github-user>/a-studio"

# External dependencies are added here as crates are ported (docs/03-dependencies.md lists every
# crate and version both upstream workspaces use, and the version to pick where they differ).
[workspace.dependencies]
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
proptest = "1"
rayon = "1"
moxcms = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[profile.release]
panic = "unwind"
